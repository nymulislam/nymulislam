<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Peaceful desert dusk with a mosque, camels and palm trees" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1A3D"/>
      <stop offset=".3" stop-color="#43335F"/>
      <stop offset=".5" stop-color="#8B5568"/>
      <stop offset=".66" stop-color="#E08F5E"/>
      <stop offset=".75" stop-color="#F5C487"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#F6E7C1" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F6E7C1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizon">
      <stop offset="0" stop-color="#FFD9A0" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FFD9A0" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="1200" height="360" fill="#fff"/>
      <circle cx="1042" cy="68" r="24" fill="#000"/>
    </mask>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="star" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect x="5" y="5" width="12" height="12" fill="none" stroke="#E8C57F" stroke-width=".7"/>
      <rect x="5" y="5" width="12" height="12" fill="none" stroke="#E8C57F" stroke-width=".7" transform="rotate(45 11 11)"/>
      <circle cx="11" cy="11" r="1.3" fill="#E8C57F"/>
    </pattern>
    <path id="farCrest" d="M-100 250 C50 235 300 245 450 235 S750 215 900 240 S1100 230 1300 238"/>
    <g id="camel" fill="none" stroke="#4A2D2A" stroke-linecap="round">
      <ellipse cx="0" cy="-14" rx="14" ry="6" fill="#4A2D2A" stroke="none"/>
      <ellipse cx="-3" cy="-21" rx="5" ry="5" fill="#4A2D2A" stroke="none"/>
      <line x1="10" y1="-16" x2="17" y2="-28" stroke-width="4"/>
      <ellipse cx="20" cy="-29" rx="5" ry="2.6" fill="#4A2D2A" stroke="none" transform="rotate(20 20 -29)"/>
      <line x1="-9" y1="-10" x2="-9" y2="0" stroke-width="2.2"/>
      <line x1="-5" y1="-10" x2="-5" y2="0" stroke-width="2.2"/>
      <line x1="6" y1="-10" x2="6" y2="0" stroke-width="2.2"/>
      <line x1="10" y1="-10" x2="10" y2="0" stroke-width="2.2"/>
      <path d="M-14 -16 Q-19 -12 -17 -6" stroke-width="1.5"/>
    </g>
    <g id="palm">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-1.5 0 0;1.5 0 0;-1.5 0 0" dur="7s" repeatCount="indefinite"/>
        <path d="M0 0 Q-15 -40 -8 -82" fill="none" stroke="#2B1A22" stroke-width="5" stroke-linecap="round"/>
        <g fill="none" stroke="#2B1A22" stroke-width="3" stroke-linecap="round">
          <path d="M-8 -82 Q-30 -102 -52 -80"/>
          <path d="M-8 -82 Q-22 -112 -42 -106"/>
          <path d="M-8 -82 Q-4 -112 -14 -120"/>
          <path d="M-8 -82 Q10 -110 30 -100"/>
          <path d="M-8 -82 Q16 -98 38 -76"/>
          <path d="M-8 -82 Q0 -106 12 -114"/>
        </g>
      </g>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="360" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#FFF3D6">
    <circle cx="80" cy="40" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="95" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="30" r="1.6"><animate attributeName="opacity" values=".2;1;.2" dur="3.5s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="70" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="5s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="25" r="1.3"><animate attributeName="opacity" values=".2;1;.2" dur="4s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="510" cy="60" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="3s" begin=".2s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="20" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="3.6s" begin=".9s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="35" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="4.5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="80" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="28" r="1.3"><animate attributeName="opacity" values=".2;1;.2" dur="5s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="90" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="3.8s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="50" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="4.4s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="30" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="4s" begin=".3s" repeatCount="indefinite"/></circle>
    <circle cx="1170" cy="100" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="125" r="1"><animate attributeName="opacity" values=".2;1;.2" dur="4.2s" begin="1.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Moon -->
  <circle cx="1030" cy="75" r="85" fill="url(#moonGlow)">
    <animate attributeName="opacity" values=".6;1;.6" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="75" r="26" fill="#F6E7C1" mask="url(#crescent)"/>

  <!-- Horizon glow -->
  <ellipse cx="600" cy="250" rx="520" ry="90" fill="url(#horizon)"/>

  <!-- Dua (Arabic calligraphy) -->
  <g text-anchor="middle" filter="url(#glow)">
    <text x="600" y="122" font-size="46" fill="#F7DFA8" xml:lang="ar" direction="rtl" font-family="Amiri, 'Noto Naskh Arabic', 'Traditional Arabic', 'Geeza Pro', 'Segoe UI', serif">وَقُل رَّبِّ زِدْنِي عِلْمًا
      <animate attributeName="opacity" from="0" to="1" dur="3s" fill="freeze"/>
    </text>
  </g>
  <text x="600" y="156" text-anchor="middle" font-size="14" letter-spacing="5" fill="#F2DDB8" opacity=".85" font-family="Georgia, 'Times New Roman', serif">KEEP CODING · KEEP GROWING</text>

  <!-- Distant mosque -->
  <g fill="#8A5648">
    <path d="M338 236 A22 22 0 0 1 382 236Z"/>
    <rect x="359" y="204" width="2" height="8"/>
    <rect x="328" y="228" width="64" height="30"/>
    <rect x="316" y="206" width="6" height="52"/>
    <path d="M314 206 L319 192 L324 206Z"/>
    <rect x="398" y="206" width="6" height="52"/>
    <path d="M396 206 L401 192 L406 206Z"/>
  </g>

  <!-- Far dune -->
  <path d="M-100 250 C50 235 300 245 450 235 S750 215 900 240 S1100 230 1300 238 L1300 360 L-100 360Z" fill="#C98A5C"/>

  <!-- Camel caravan -->
  <use xlink:href="#camel"><animateMotion dur="90s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#farCrest"/></animateMotion></use>
  <use xlink:href="#camel"><animateMotion dur="90s" begin="-3s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#farCrest"/></animateMotion></use>
  <use xlink:href="#camel"><animateMotion dur="90s" begin="-6s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#farCrest"/></animateMotion></use>

  <!-- Mid dune -->
  <path d="M0 285 C200 262 400 290 600 275 S1000 262 1200 280 L1200 360 L0 360Z" fill="#A85F3D"/>

  <!-- Drifting sand -->
  <g fill="#F6D9A5" opacity=".6">
    <circle cx="1250" cy="268" r="1.2"><animate attributeName="cx" from="1250" to="-50" dur="26s" repeatCount="indefinite"/></circle>
    <circle cx="1250" cy="292" r="1"><animate attributeName="cx" from="1250" to="-50" dur="34s" begin="-10s" repeatCount="indefinite"/></circle>
    <circle cx="1250" cy="278" r="1.4"><animate attributeName="cx" from="1250" to="-50" dur="30s" begin="-18s" repeatCount="indefinite"/></circle>
    <circle cx="1250" cy="305" r="1"><animate attributeName="cx" from="1250" to="-50" dur="38s" begin="-5s" repeatCount="indefinite"/></circle>
    <circle cx="1250" cy="258" r="1"><animate attributeName="cx" from="1250" to="-50" dur="42s" begin="-25s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Near dune -->
  <path d="M0 318 C250 300 500 330 760 312 S1050 305 1200 316 L1200 360 L0 360Z" fill="#6E3B30"/>

  <!-- Palms -->
  <g transform="translate(1100 322)"><use xlink:href="#palm"/></g>
  <g transform="translate(1152 326) scale(.7)"><use xlink:href="#palm"/></g>

  <!-- Arabesque border -->
  <rect x="0" y="338" width="1200" height="22" fill="#2B1A22"/>
  <rect x="0" y="338" width="1200" height="22" fill="url(#star)" opacity=".55"/>
  <rect x="0" y="337" width="1200" height="1.5" fill="#E8C57F" opacity=".8"/>
</svg>
